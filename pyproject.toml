[project]
name = "gemini-jira-federated"
version = "0.1.0"
description = "ADK RAG agent over Gemini Enterprise Jira Federated Data Connector (jira-federated_1782320633397) with OAuth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.19.0,<2.0.0",
    "google-auth>=2.28.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jira_federated_agent*"]

[tool.uv]
index-url = "https://pypi.org/simple/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that query the live Gemini Enterprise Jira Federated Connector",
]
